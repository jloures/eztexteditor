<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 280px;
            padding: 16px;
            margin: 0;
            background: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
        }
        h3 {
            margin: 0 0 12px 0;
            font-size: 16px;
            color: #fff;
        }
        .open-btn {
            width: 100%;
            padding: 10px;
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        .open-btn:hover {
            background: #2563eb;
        }
        .saved-list {
            margin-top: 12px;
            max-height: 200px;
            overflow-y: auto;
        }
        .saved-item {
            padding: 8px 10px;
            background: #1e1e1e;
            border: 1px solid #2d2d2d;
            border-radius: 6px;
            margin-bottom: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #ccc;
        }
        .saved-item:hover {
            background: #2d2d2d;
            color: #fff;
        }
        .saved-item .icon {
            color: #3b82f6;
            font-size: 11px;
        }
        .empty {
            color: #666;
            font-size: 12px;
            text-align: center;
            padding: 8px;
        }
    </style>
</head>
<body>
    <h3>EZ Text Editor</h3>
    <button class="open-btn" id="openBtn">Open Editor</button>
    <div class="saved-list" id="savedList"></div>
    <script src="popup.js"></script>
</body>
</html>
